eq____&quot;Supondo que $AE\\\\not{AD}$, supomos que $AElogseq____&lt;AD$, logo existe um ponto $Elogseq____&apos;$ no segmento $[AD]$ tal que $AElogseq____&apos;=AE$. Comparando os triângulos $Elogseq____&apos;AM$ e $EAM$, temos: $\\\\widehat{Elogseq____&apos;AM}=\\\\widehat{EAM}$ pois $[AM)$ é a bissetriz.\\n\\n$AM$ é lado comum e $Elogseq____&apos;A=EA$.\\n\\nPelo caso *LAL*[^1], os dois triângulos $Elogseq____&apos;AM$ e $EAM$ são congruentes, mas $EAM$ é um triângulo retângulo em $E$, logo $Elogseq____&apos;=D$, pois $MD$ é a única perpendicular à reta $(DA)$ passando por $M$. Temos, então: $MElogseq____&apos;=MD=ME$\\n![7,1.png](../assets/7,1_1778874384651_0.png) ![image.png](../assets/image_1778785002387_0.png)\\n\\n[^1]: **L** ($AElogseq____&apos;=AE$), **A** ($\\\\widehat{Elogseq____&apos;AM}=\\\\widehat{EAM}$), **L** ($AM=AM$)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^Flogseq____&quot;,212,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^Vlogseq____&quot;,212,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^Ulogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a087333-fafe-4e19-a237-3a3ca6073298logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Flogseq____&quot;,213,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Vlogseq____&quot;,212,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Ulogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a087333-0cb4-4b0e-a4c4-64a0981ea94clogseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;## 1.2 Teorema\\n#+BEGIN_QUOTE\\nAs bissetrizes internas de um triângulo são concorrentes em um ponto chamado de incentro por ser o centro do círculo inscrito.\\n#+END_QUOTE\\n**Demonstração**: seja um triângulo $ABC$ e duas bissetrizes $(AD)$ e $(BE)$ respectivamente dos ângulos $\\\\widehat{BAC}$ e $\\\\widehat{ABC}$. As duas bissetrizes se encontram em um ponto $I.$ Mostre que $CI$ é a terceira bissetriz.\\n![image.png](../assets/image_1778938339488_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Flogseq____&quot;,212,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Vlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Ulogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1@logseq____&quot;,2],536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Jlogseq____&quot;,[],536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a087333-ea33-4693-85cc-1a29b434fdf0logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;O fato de $(AD)$ ser a bissetriz de $\\\\widehat{BAC}$ faz com que $\\\\widehat{BAD}=\\\\widehat{CAD}$. O mesmo vale para os ângulos $\\\\widehat{ABE}$ e $\\\\widehat{CBE}$ que são iguais por serem ângulos cortados pela bissetriz $(BE)$.\\n\\nAs duas bissetrizes concorrem num ponto $I$.\\n\\nConsideramos as bissetrizes de dois dos seus ângulos internos. As duas bissetrizes concorrem num ponto $I$.\\n\\n[^1]: Qualquer ponto que pertence às bissetrizes é equidistante dos dois lados daquele ângulo, ou seja, $I$ está na bissetriz $(AD)$ então ele é equidistante dos dois lados do ângulo $\\\\widehat{BAC}$\\n \\nComo o ponto $I$ pertence à bissetriz do ângulo $\\\\widehat{BAC}$, sabemos que ele é equidistante das retas $(AB)$ e $(AC)$. Entretanto, também é equidistante das retas $(AB)$ e $(BC)$, por estar na bissetriz do ângulo $ABC$. Assim, concluímos que o ponto $I$ é equidistante das retas $(AC)$ e $(BC)$, pelo que também pertence à bissetriz do ângulo $\\\\widehat{ACB}$.\\n![image.png](../assets/image_1778937205234_0.png)\\nAssim temos $IF=IG$.\\nDesenhando uma outra perpendicular, $IH$, a distância será a mesma pois $I$ é um ponto da bissetriz, ou seja, temos $IF=IG=IH$ então $IF=IH$. Mas se $IH$ é equidistante de dois lados de um ângulo, $I$ está em uma bissetriz do ângulo $\\\\widehat{ACB}$. Logo, as bissetrizes internas de um triângulo são concorrentes em um ponto $I$.\\n![image.png](../assets/image_1778937699825_0.png) \\n$I$ é o incentro do triângulo $ABC$, ou seja, é o centro de uma circunferência que é inscrita ao triângulo que é tangente aos três lados do triângulo.\\n![image.png](../assets/image_1778937950822_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Flogseq____&quot;,215,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Vlogseq____&quot;,215,536870944]],[logseq____& 2658_0.png) \\nOs triângulos $FBA$ e $FBC$ possuem **mesma área**, pois estão construídos em um **mesmo lado** comum $[FB]$ e o **vértice** está em uma **paralela** à base.[^1]\\n![image.png](../assets/image_1778893265548_0.png)\\nOs triângulos $ABD$ e $PBD$ possuem **mesma área**, pois estão construídos em um **mesmo lado** comum $[BD]$ e o **vértice** está em uma **paralela** à base.[^2]\\n![image.png](../assets/image_1778894844751_0.png)\\nDe acordo com as afirmações acima $ABFG$ tem a mesma área de $BPLD$, pois o triângulo $FBA$ é metade do quadrado $AGFB$, o triângulo $PDL$ é metade do retângulo $BDLP$, mas temos que o triângulo $FBA$ têm a mesma área que $FBC$ e o triângulo $BDP$ tem a mesma área que $ABD$ o que significa que, como $FBC$ e $ABD$ têm a mesma área por serem triângulos congruentes, $$FBA$$ e $BDP$ tem a mesma área pois têm áreas de triângulos congruentes. logo a área do quadrado $ABFG$ tem a mesma área de $BPLD$.\\n\\nPodendo repetir o mesmo raciocínio para o outro lado, o Teorema de Pitágoras é provado:\\n![image.png](../assets/image_1778895516666_0.png)logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Flogseq____&quot;,326,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Xlogseq____&quot;,321,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Vlogseq____&quot;,326,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Ulogseq____&quot;,321,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a087334-6749-4773-bdf5-f5dc7a1833aflogseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[328,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;## Referências\\n[^1]: Os triângulos que estão sobre a *mesma base* e nas *mesmas paralelas* são iguais entre si (**Proposição 37*       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
