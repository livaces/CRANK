t;,212,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^Vlogseq____&quot;,212,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^Ulogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[213,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08726b-a522-4254-8e59-92537cafc6eclogseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Flogseq____&quot;,213,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Vlogseq____&quot;,212,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^Ulogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[214,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08726b-567a-48c3-b062-1c8a4f445c82logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;## 1.2 Teorema\\n#+BEGIN_QUOTE\\nAs bissetrizes internas de um triângulo são concorrentes em um ponto chamado de incentro por ser o centro do círculo inscrito.\\n#+END_QUOTE\\n**Demonstração**: seja um triângulo $ABC$ e duas bissetrizes $(AD)$ e $(BE)$ respectivamente dos ângulos $\\\\widehat{BAC}$ e $\\\\widehat{ABC}$. As duas bissetrizes se encontram em um ponto $I.$ Mostre que $CI$ é a terceira bissetriz.\\n![image.png](../assets/image_1778938339488_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Flogseq____&quot;,212,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Vlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Ulogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1@logseq____&quot;,2],536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^Jlogseq____&quot;,[],536870944]],[logseq____&quot;^15logseq____&quot;,[215,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08726b-68a5-4905-b6ab-0d2a28264f05logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;O fato de $(AD)$ ser a bissetriz de $\\\\widehat{BAC}$ faz com que $\\\\widehat{BAD}=\\\\widehat{CAD}$. O mesmo vale para os ângulos $\\\\widehat{ABE}$ e $\\\\widehat{CBE}$ que são iguais por serem ângulos cortados pela bissetriz $(BE)$.\\n\\nAs duas bissetrizes concorrem num ponto $I$.\\n\\nConsideramos as bissetrizes de dois dos seus ângulos internos. As duas bissetrizes concorrem num ponto $I$.\\n\\n[^1]: Qualquer ponto que pertence às bissetrizes é equidistante dos dois lados daquele ângulo, ou seja, $I$ está na bissetriz $(AD)$ então ele é equidistante dos dois lados do ângulo $\\\\widehat{BAC}$\\n \\nComo o ponto $I$ pertence à bissetriz do ângulo $\\\\widehat{BAC}$, sabemos que ele é equidistante das retas $(AB)$ e $(AC)$. Entretanto, também é equidistante das retas $(AB)$ e $(BC)$, por estar na bissetriz do ângulo $ABC$. Assim, concluímos que o ponto $I$ é equidistante das retas $(AC)$ e $(BC)$, pelo que também pertence à bissetriz do ângulo $\\\\widehat{ACB}$.\\n![image.png](../assets/image_1778937205234_0.png)\\nAssim temos $IF=IG$.\\nDesenhando uma outra perpendicular, $IH$, a distância será a mesma pois $I$ é um ponto da bissetriz, ou seja, temos $IF=IG=IH$ então $IF=IH$. Mas se $IH$ é equidistante de dois lados de um ângulo, $I$ está em uma bissetriz do ângulo $\\\\widehat{ACB}$. Logo, as bissetrizes internas de um triângulo são concorrentes em um ponto $I$.\\n![image.png](../assets/image_1778937699825_0.png) \\n$I$ é o incentro do triângulo $ABC$, ou seja, é o centro de uma circunferência que é inscrita ao triângulo que é tangente aos três lados do triângulo.\\n![image.png](../assets/image_1778937950822_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Flogseq____&quot;,215,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Vlogseq____&quot;,215,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Ulogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08726b-ac54-48e1-a745-702a1fc6b60elogseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[218,logseq____&quot;^Klogseq____&quot;,1778938475229,536870945]],[logseq____&quot;^15logseq____&quot;,[218,logseq____&quot;^@logseq____&quot;,false,536870945]],[logseq____&quot;^15logseq____&quot;,[218,logseq____&quot;^Ylogseq____&quot;,logseq____&quot;conjuntoslogseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[218,logseq____&quot;^11logseq____&quot;,logseq____&quot;Conjuntoslogseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[218,logseq____&quot;^Blogseq____&quot;,1778938475229,536870945]],[logseq____&quot;^15logseq____&quot;,[218,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08726b-4175-4928-9256-f94adb6cb515logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[219,logseq____&quot;^Klogseq____&quot;,1778938475229,536870945]],[logseq_       // This script checks to see if a redirect is present in the query string

      (function(l) {
