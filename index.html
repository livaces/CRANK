 inscrito.\\n#+END_QUOTE\\n**Demonstração**: seja um triângulo $ABC$ e duas bissetrizes $(AD)$ e $(BE)$ respectivamente dos ângulos $\\\\widehat{BAC}$ e $\\\\widehat{ABC}$. As duas bissetrizes se encontram em um ponto $I.$ Mostre que $CI$ é a terceira bissetriz.\\n![image.png](../assets/image_1778938339488_0.png)logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[258,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[258,logseq____&quot;^Flogseq____&quot;,255,536870945]],[logseq____&quot;^15logseq____&quot;,[258,logseq____&quot;^Xlogseq____&quot;,250,536870945]],[logseq____&quot;^15logseq____&quot;,[258,logseq____&quot;^Vlogseq____&quot;,250,536870945]],[logseq____&quot;^15logseq____&quot;,[258,logseq____&quot;^Ulogseq____&quot;,250,536870945]],[logseq____&quot;^15logseq____&quot;,[258,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1@logseq____&quot;,2],536870945]],[logseq____&quot;^15logseq____&quot;,[258,logseq____&quot;^Jlogseq____&quot;,[],536870945]],[logseq____&quot;^15logseq____&quot;,[258,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d162-3d1c-4322-8b29-af701f0c63b1logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[259,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;O fato de $(AD)$ ser a bissetriz de $\\\\widehat{BAC}$ faz com que $\\\\widehat{BAD}=\\\\widehat{CAD}$. O mesmo vale para os ângulos $\\\\widehat{ABE}$ e $\\\\widehat{CBE}$ que são iguais por serem ângulos cortados pela bissetriz $(BE)$.\\n\\nAs duas bissetrizes concorrem num ponto $I$.\\n\\nConsideramos as bissetrizes de dois dos seus ângulos internos. As duas bissetrizes concorrem num ponto $I$.\\n\\n[^1]: Qualquer ponto que pertence às bissetrizes é equidistante dos dois lados daquele ângulo, ou seja, $I$ está na bissetriz $(AD)$ então ele é equidistante dos dois lados do ângulo $\\\\widehat{BAC}$\\n \\nComo o ponto $I$ pertence à bissetriz do ângulo $\\\\widehat{BAC}$, sabemos que ele é equidistante das retas $(AB)$ e $(AC)$. Entretanto, também é equidistante das retas $(AB)$ e $(BC)$, por estar na bissetriz do ângulo $ABC$. Assim, concluímos que o ponto $I$ é equidistante das retas $(AC)$ e $(BC)$, pelo que também pertence à bissetriz do ângulo $\\\\widehat{ACB}$.\\n![image.png](../assets/image_1778937205234_0.png)\\nAssim temos $IF=IG$.\\nDesenhando uma outra perpendicular, $IH$, a distância será a mesma pois $I$ é um ponto da bissetriz, ou seja, temos $IF=IG=IH$ então $IF=IH$. Mas se $IH$ é equidistante de dois lados de um ângulo, $I$ está em uma bissetriz do ângulo $\\\\widehat{ACB}$. Logo, as bissetrizes internas de um triângulo são concorrentes em um ponto $I$.\\n![image.png](../assets/image_1778937699825_0.png) \\n$I$ é o incentro do triângulo $ABC$, ou seja, é o centro de uma circunferência que é inscrita ao triângulo que é tangente aos três lados do triângulo.\\n![image.png](../assets/image_1778937950822_0.png)logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[259,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[259,logseq____&quot;^Flogseq____&quot;,258,536870945]],[logseq____&quot;^15logseq____&quot;,[259,logseq____&quot;^Xlogseq____&quot;,250,536870945]],[logseq____&quot;^15logseq____&quot;,[259,logseq____&quot;^Vlogseq____&quot;,258,536870945]],[logseq____&quot;^15logseq____&quot;,[259,logseq____&quot;^Ulogseq____&quot;,250,536870945]],[logseq____&quot;^15logseq____&quot;,[259,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d162-2cba-4f7d-9308-b7942f5b5494logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[261,logseq____&quot;^Klogseq____&quot;,1778962786529,536870946]],[logseq____&quot;^15logseq____&quot;,[261,logseq____&quot;^@logseq____&quot;,false,536870946]],[logseq____&quot;^15logseq____&quot;,[261,logseq____&quot;^Ylogseq____&quot;,logseq____&quot;conjuntoslogseq____&quo uot;,logseq____&quot;^17logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[419,logseq____&quot;^Flogseq____&quot;,418,536870970]],[logseq____&quot;^15logseq____&quot;,[419,logseq____&quot;^Xlogseq____&quot;,415,536870970]],[logseq____&quot;^15logseq____&quot;,[419,logseq____&quot;^Vlogseq____&quot;,415,536870970]],[logseq____&quot;^15logseq____&quot;,[419,logseq____&quot;^Ulogseq____&quot;,415,536870970]],[logseq____&quot;^15logseq____&quot;,[419,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1@logseq____&quot;,2],536870970]],[logseq____&quot;^15logseq____&quot;,[419,logseq____&quot;^Jlogseq____&quot;,[],536870970]],[logseq____&quot;^15logseq____&quot;,[419,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d162-74bc-4dbe-a488-a30b5cee6eb5logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;## 1. Teorema\\n#+BEGIN_QUOTE\\nO ângulo externo de um triângulo é maior do que cada um dos ângulos do triângulo que não lhe são adjacentes.\\n#+END_QUOTE\\n**Demonstração**: seja um triângulo $ABC$ e o ângulo externo $\\\\widehat{ACD}$. Mostre que o ângulo $\\\\widehat{ACD}$ é maior do que o ângulo $\\\\widehat{BAC}$ sendo $E$ o ponto médio do segmento $[AC]$, trançando a semirreta $[BE)$, e o ponto $F$ desta semirreta tal que $E$ seja também o ponto médio do segmento $[BF]$.\\n![image.png](../assets/image_1778958405773_0.png)logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^Flogseq____&quot;,419,536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^Xlogseq____&quot;,415,536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^Vlogseq____&quot;,415,536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^Ulogseq____&quot;,415,536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1@logseq____&quot;,2],536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^Jlogseq____&quot;,[],536870970]],[logseq____&quot;^15logseq____&quot;,[420,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d162-3837-4b88-a802-a903344d7b86logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[421,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Comparando os triângulos $ABE$ e $CEF$ temos que os ângulos $\\\\widehat{AEB}$ e $\\\\widehat{CEF}$ são opostos pelo vértice e são, portanto, iguais. Temos também, por construção, $AE=EC$ e $BE=EF$.\\n\\nPelo caso *LAL* os triângulos $AEB$ e $CEF$ são congruentes e, portanto, $\\\\widehat{BAC}=\\\\widehat{ACF}$. O ponto $F$ está no interior do ângulo $\\\\widehat{ACD}$[^1]. A semirreta $[BE)$ é interior ao ângulo $ABC$, pois $E$ está no segmento $AC$ o que significa que o ponto $F$ está do mesmo lado do que $A$ em relação à reta $(BC)$.\\n\\nOs pontos $B$ e $F$ são de lado oposto em relação à reta $(AC)$. Os pontos $B$ e $D$ são também de lado oposto em relação à reta $(AC)$. Logo o ponto $F$ é do mesmo lado do que $D$ em relação à reta $(BD)$, a semirreta $[AF)$ é interior ao ângulo $\\\\widehat{ACD}$.\\n\\nComo o ângulo $\\\\widehat{ACF}$ está dentro do ângulo $\\\\widehat{ACD}$, o ângulo $\\\\widehat{ACD}$ é maior do que o ângulo $\\\\widehat{ACF}$ e, portanto, o ângulo $\\\\widehat{ACD}$ é maior do que o ângulo $\\\\widehat{BAC}$.\\n![image.png](../assets/image_1778961402027_0.png)logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[421,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[421,logseq____&quot;^Flogseq____&quot;,420,536870970]],[logseq____&quot;^15logseq____&quot;,[421,logseq____&quot;^Xlogseq____&quot;,415,536870970]],[logseq____&quot;^15logseq____&quot;,[421,logseq____&quo       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
