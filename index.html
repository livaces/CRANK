821b4506273alogseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Consideramos as bissetrizes de dois dos seus ângulos internos. As duas bissetrizes concorrem num ponto $I$.\\n\\nComo o ponto $I$ pertence à bissetriz do ângulo $\\\\widehat{BAC}$, sabemos que ele é equidistante das retas $(AB)$ e $(AC)$. Entretanto, também é equidistante das retas $AB)$ e $(BC)$, por estar na bissetriz do ângulo $ABC$. Assim, concluímos que o ponto $I$ é equidistante das retas $(AC)$ e $(BC)$, pelo que também pertence à bissetriz di ângulo $\\\\widehat{ACB}$.\\n\\nSejam $H$, $L$ e $G$ os pés das retas perpendiculares aos lados que passam por $I$. Como $I$ está à mesma distância das retas $(AB)$, $(BC)$ e $(AC)$, temos que os segmentos $[IH]=[IL]=[IG]$ são iguais. Assim, a circunferência de centro $I$ que passa num destes pontos, também passa nos outros dois.\\n\\nO ponto $I$, ponto de interseção das três bissetrizes, diz-se o incentro do triângulo e a circunferência tangente aos três lados do triângulo chama circunferência inscrita no triângulo.\\n![09.png](../assets/09_1778874430221_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Flogseq____&quot;,224,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Xlogseq____&quot;,217,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Vlogseq____&quot;,224,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Ulogseq____&quot;,217,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a07d09b-556c-4ca9-b5e5-32bc095d58fflogseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.

      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};

            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
