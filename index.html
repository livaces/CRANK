os;AM}=\\\\widehat{EAM}$ pois $[AM)$ é a bissetriz.\\n\\n$AM$ é lado comum e $Elogseq____&apos;A=EA$.\\n\\nPelo caso *LAL*[^2], os dois triângulos $Elogseq____&apos;AM$ e $EAM$ são congruentes, mas $EAM$ é um triângulo retângulo em $E$, logo $Elogseq____&apos;=D$, pois $MD$ é a única perpendicular à reta $(DA)$ passando por $M$. Temos, então: $MElogseq____&apos;=MD=ME$\\n![7,1.png](../assets/7,1_1778874384651_0.png) \\n\\n[^2]: L ($AElogseq____&apos;=AE$), A ($\\\\widehat{Elogseq____&apos;AM}=\\\\widehat{EAM}$), L ($AM=AM$).logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Flogseq____&quot;,227,536870944]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Xlogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Vlogseq____&quot;,227,536870944]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Ulogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a090985-ce30-4b68-9cdb-d078ad381c31logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[229,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[229,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[229,logseq____&quot;^Flogseq____&quot;,228,536870944]],[logseq____&quot;^15logseq____&quot;,[229,logseq____&quot;^Xlogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[229,logseq____&quot;^Vlogseq____&quot;,227,536870944]],[logseq____&quot;^15logseq____&quot;,[229,logseq____&quot;^Ulogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[229,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a090985-f1e9-499e-bd5f-c9fd3683e903logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;## 1.2 Teorema\\n#+BEGIN_QUOTE\\nAs bissetrizes internas de um triângulo são concorrentes em um ponto chamado de incentro por ser o centro do círculo inscrito.\\n#+END_QUOTE\\n**Demonstração**: seja um triângulo $ABC$ e duas bissetrizes $(AD)$ e $(BE)$ respectivamente dos ângulos $\\\\widehat{BAC}$ e $\\\\widehat{ABC}$. As duas bissetrizes se encontram em um ponto $I.$ Mostre que $CI$ é a terceira bissetriz.\\n![image.png](../assets/image_1778938339488_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Flogseq____&quot;,227,536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Xlogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Vlogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Ulogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1@logseq____&quot;,2],536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Jlogseq____&quot;,[],536870944]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a090985-6677-4125-868a-3e9a4e734862logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[231,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;O fato de $(AD)$ ser a bissetriz de $\\\\widehat{BAC}$ faz com que $\\\\widehat{BAD}=\\\\widehat{CAD}$. O mesmo vale para os ângulos $\\\\widehat{ABE}$ e $\\\\widehat{CBE}$ que são iguais por serem ângulos cortados pela bissetriz $(BE)$.\\n\\nAs duas bissetrizes concorrem num ponto $I$.\\n\\nConsideramos as bissetrizes de dois dos seus ângulos internos. As duas bissetrizes concorrem num ponto $I$.\\n\\n[^1]: Qualquer ponto que pertence às bissetrizes é equidistante dos dois lados daquele ângulo, ou seja, $I$ está na bissetriz $(AD)$ então ele é equidistante dos dois lados do ângulo $\\\\widehat{BAC}$\\n \\nComo o ponto $I$ pertence à bissetriz do ângulo $\\\\widehat{BAC}$, sabemos que ele é equidistante das retas $(AB)$ e $(AC)$. Entretanto, também é equidistante das retas $(AB)$ e $(BC)$, por estar na bissetriz do ângulo $ABC$. Assim, concluímos que o ponto $I$ é equidistante das retas $(AC)$ e $(BC)$, pelo que também pertence à bissetriz do ângulo $\\\\widehat{ACB}$.\\n![image.png](../assets/image_1778937205234_0.png)\\nAssim temos $IF=IG$.\\nDesenhando uma outra perpendicular, $IH$, a distância será a mesma pois $I$ é um ponto da bissetriz, ou seja, temos $IF=IG=IH$ então $IF=IH$. Mas se $IH$ é equidistante de dois lados de um ângulo, $I$ está em uma bissetriz do ângulo $\\\\widehat{ACB}$. Logo, as bissetrizes internas de um triângulo são concorrentes em um ponto $I$.\\n![image.png](../assets/image_1778937699825_0.png) \\n$I$ é o incentro do triângulo $ABC$, ou seja, é o centro de uma circunferência que é inscrita ao triângulo que é tangente aos três lados do triângulo.\\n![image.png](../assets/image_1778937950822_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[231,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[231,logseq____&quot;^Flogseq____&quot;,230,536870944]],[logseq____&quot;^15logseq____&quot;,[231,logseq____&quot;^Xlogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[231,logseq____&quot;^Vlogseq____&quot;,230,536870944]],[logseq____&quot;^15logseq____&quot;,[231,logseq____&quot;^Ulogseq____&quot;,222,536870944]],[logseq____&quot;^15logseq____&quot;,[231,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a090985-2f41-4084-b337-356946afebc6logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[233,logseq____&quot;^Klogseq____&quot;,       // This script checks to see if a redirect is present in the query string

      (function(l) {

            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +

              l.hash
            );
          }
