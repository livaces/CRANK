8f20a258bd2alogseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Consideramos as bissetrizes de dois dos seus ângulos internos. As duas bissetrizes concorrem num ponto $I$.\\n\\nComo o ponto $I$ pertence à bissetriz do ângulo $\\\\widehat{BAC}$, sabemos que ele é equidistante das retas $(AB)$ e $(AC)$. Entretanto, também é equidistante das retas $AB)$ e $(BC)$, por estar na bissetriz do ângulo $ABC$. Assim, concluímos que o ponto $I$ é equidistante das retas $(AC)$ e $(BC)$, pelo que também pertence à bissetriz di ângulo $\\\\widehat{ACB}$.\\n\\nSejam $H$, $L$ e $G$ os pés das retas perpendiculares aos lados que passam por $I$. Como $I$ está à mesma distância das retas $(AB)$, $(BC)$ e $(AC)$, temos que os segmentos $[IH]=[IL]=[IG]$ são iguais. Assim, a circunferência de centro $I$ que passa num destes pontos, também passa nos outros dois.\\n\\nO ponto $I$, ponto de interseção das três bissetrizes, diz-se o incentro do triângulo e a circunferência tangente aos três lados do triângulo chama circunferência inscrita no triângulo.\\n![09.png](../assets/09_1778874430221_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Flogseq____&quot;,224,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Xlogseq____&quot;,217,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Vlogseq____&quot;,224,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Ulogseq____&quot;,217,536870944]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a07cffd-3519-4b7e-9288-86ef56353ca4logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot uot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1@logseq____&quot;,2],536870960]],[logseq____&quot;^15logseq____&quot;,[330,logseq____&quot;^Jlogseq____&quot;,[],536870960]],[logseq____&quot;^15logseq____&quot;,[330,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a07cffd-c56a-4bfd-a2ee-88ba7688b6d7logseq____&quot;,536870960]],[logseq____&quot;^15logseq____&quot;,[331,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Trace uma reta paralela $(r)$ ao segmento $[BD]$ e ao segmento $[CE]$ passando pelo ponto $A$.\\n$\\\\overline{BF}=\\\\overline{BA}$, pois $AGFB$ é quadrado.\\n$\\\\overline{BD}=\\\\overline{BC}$, pois $BCED$ é quadrado.\\n$\\\\widehat{FBC}=\\\\widehat{ABD}$, pois são compostos de um ângulo reto mais o ângulo $\\\\widehat{ABC}$.\\nLogo temos que o triângulo $FBC$ é congruente ao triângulo $ABD$ pelo caso *LAL*, e, como são congruentes, possuem a **mesma área**\\n![image.png](../assets/image_1778894758498_0.png) \\n![image.png](../assets/image_1778894652658_0.png) \\nOs triângulos $FBA$ e $FBC$ possuem **mesma área**, pois estão construídos em um **mesmo lado** comum $[FB]$ e o **vértice** está em uma **paralela** à base.[^1]\\n![image.png](../assets/image_1778893265548_0.png)\\nOs triângulos $ABD$ e $PBD$ possuem **mesma área**, pois estão construídos em um **mesmo lado** comum $[BD]$ e o **vértice** está em uma **paralela** à base.[^2]\\n![image.png](../assets/image_1778894844751_0.png)\\nDe acordo com as afirmações acima $ABFG$ tem a mesma área de $BPLD$, pois o triângulo $FBA$ é metade do quadrado $AGFB$, o triângulo $PDL$ é metade do retângulo $BDLP$, mas temos que o triângulo $FBA$ têm a mesma área que $FBC$ e o triângulo $BDP$ tem a mesma área que $ABD$ o que significa que, como $FBC$ e $ABD$ têm a mesma área por serem triângulos congruentes, $$FBA$$ e $BDP$ tem a mesma área pois têm áreas de triângulos congruentes. logo a área do quadrado $ABFG$ tem a mesma área de $BPLD$.\\n\\nPodendo repetir o mesmo raciocínio para o outro lado,       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
