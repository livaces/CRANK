t;,[225,logseq____&quot;^Flogseq____&quot;,224,536870945]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Xlogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Vlogseq____&quot;,224,536870945]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^Ulogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[225,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d6d2-7d57-4409-ad15-23920112a14flogseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^Flogseq____&quot;,225,536870945]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^Xlogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^Vlogseq____&quot;,224,536870945]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^Ulogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[226,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d6d2-4c98-411b-bb9f-010b91753bd7logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;## 1.2 Teorema\\n#+BEGIN_QUOTE\\nAs bissetrizes internas de um triângulo são concorrentes em um ponto chamado de incentro por ser o centro do círculo inscrito.\\n#+END_QUOTE\\n**Demonstração**: seja um triângulo $ABC$ e duas bissetrizes $(AD)$ e $(BE)$ respectivamente dos ângulos $\\\\widehat{BAC}$ e $\\\\widehat{ABC}$. As duas bissetrizes se encontram em um ponto $I.$ Mostre que $CI$ é a terceira bissetriz.\\n![image.png](../assets/image_1778938339488_0.png)logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^Flogseq____&quot;,224,536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^Xlogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^Vlogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^Ulogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1@logseq____&quot;,2],536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^Jlogseq____&quot;,[],536870945]],[logseq____&quot;^15logseq____&quot;,[227,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d6d2-be1b-4e32-b82a-febc37df3f4elogseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;O fato de $(AD)$ ser a bissetriz de $\\\\widehat{BAC}$ faz com que $\\\\widehat{BAD}=\\\\widehat{CAD}$. O mesmo vale para os ângulos $\\\\widehat{ABE}$ e $\\\\widehat{CBE}$ que são iguais por serem ângulos cortados pela bissetriz $(BE)$.\\n\\nAs duas bissetrizes concorrem num ponto $I$.\\n\\nConsideramos as bissetrizes de dois dos seus ângulos internos. As duas bissetrizes concorrem num ponto $I$.\\n\\n[^1]: Qualquer ponto que pertence às bissetrizes é equidistante dos dois lados daquele ângulo, ou seja, $I$ está na bissetriz $(AD)$ então ele é equidistante dos dois lados do ângulo $\\\\widehat{BAC}$\\n \\nComo o ponto $I$ pertence à bissetriz do ângulo $\\\\widehat{BAC}$, sabemos que ele é equidistante das retas $(AB)$ e $(AC)$. Entretanto, também é equidistante das retas $(AB)$ e $(BC)$, por estar na bissetriz do ângulo $ABC$. Assim, concluímos que o ponto $I$ é equidistante das retas $(AC)$ e $(BC)$, pelo que também pertence à bissetriz do ângulo $\\\\widehat{ACB}$.\\n![image.png](../assets/image_1778937205234_0.png)\\nAssim temos $IF=IG$.\\nDesenhando uma outra perpendicular, $IH$, a distância será a mesma pois $I$ é um ponto da bissetriz, ou seja, temos $IF=IG=IH$ então $IF=IH$. Mas se $IH$ é equidistante de dois lados de um ângulo, $I$ está em uma bissetriz do ângulo $\\\\widehat{ACB}$. Logo, as bissetrizes internas de um triângulo são concorrentes em um ponto $I$.\\n![image.png](../assets/image_1778937699825_0.png) \\n$I$ é o incentro do triângulo $ABC$, ou seja, é o centro de uma circunferência que é inscrita ao triângulo que é tangente aos três lados do triângulo.\\n![image.png](../assets/image_1778937950822_0.png)logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Flogseq____&quot;,227,536870945]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Xlogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Vlogseq____&quot;,227,536870945]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^Ulogseq____&quot;,219,536870945]],[logseq____&quot;^15logseq____&quot;,[228,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d6d2-3930-4516-9c76-57f80912e012logseq____&quot;,536870945]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Klogseq____&quot;,1778964178625,536870946]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^@logseq____&quot;,false,536870946]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Ylogseq____&quot;,logseq____&quot;conjuntoslogseq____&quot;,536870946]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^11logseq____&quot;,logseq____&quot;Conjuntoslogseq____&quot;,536870946]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^Blogseq____&quot;,1778964178625,536870946]],[logseq____&quot;^15logseq____&quot;,[230,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a08d6d2-8e37-4385-b581-035e2db3e36blogseq____&quot;,536870946]],[logseq____&quot;^15logseq____&quot;,[231,logseq____&quot;^Klogseq____&       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
