\\\widehat{CBE}$ que são iguais por serem ângulos cortados pela bissetriz $(BE)$.\\n\\nAs duas bissetrizes concorrem num ponto $I$.\\n\\nConsideramos as bissetrizes de dois dos seus ângulos internos. As duas bissetrizes concorrem num ponto $I$.\\n\\n[^1]: Qualquer ponto que pertence às bissetrizes é equidistante dos dois lados daquele ângulo, ou seja, $I$ está na bissetriz $(AD)$ então ele é equidistante dos dois lados do ângulo $\\\\widehat{BAC}$\\n \\nComo o ponto $I$ pertence à bissetriz do ângulo $\\\\widehat{BAC}$, sabemos que ele é equidistante das retas $(AB)$ e $(AC)$. Entretanto, também é equidistante das retas $(AB)$ e $(BC)$, por estar na bissetriz do ângulo $ABC$. Assim, concluímos que o ponto $I$ é equidistante das retas $(AC)$ e $(BC)$, pelo que também pertence à bissetriz do ângulo $\\\\widehat{ACB}$.\\n![image.png](../assets/image_1778937205234_0.png)\\nAssim temos $IF=IG$.\\nDesenhando uma outra perpendicular, $IH$, a distância será a mesma pois $I$ é um ponto da bissetriz, ou seja, temos $IF=IG=IH$ então $IF=IH$. Mas se $IH$ é equidistante de dois lados de um ângulo, $I$ está em uma bissetriz do ângulo $\\\\widehat{ACB}$. Logo, as bissetrizes internas de um triângulo são concorrentes em um ponto $I$.\\n![image.png](../assets/image_1778937699825_0.png) \\n$I$ é o incentro do triângulo $ABC$, ou seja, é o centro de uma circunferência que é inscrita ao triângulo que é tangente aos três lados do triângulo.\\n![image.png](../assets/image_1778937950822_0.png)logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Flogseq____&quot;,215,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Xlogseq____&quot;,207,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Vlogseq____&quot;,215,536870944]],[logseq____&quot;^15logseq____&quot;,[216,logseq____&quot;^Ulogseq____&q entos*\\n**Axioma C.1.** *Transporte*. Dada uma semirreta *r* com origem no ponto *A* e dado um segmento *BC*, existe um único ponto *D* sobre *r* tal que *AD* ≡ *BC*;\\n**Axioma C.2.** *Equivalência*. Se *AB* ≡ *CD* e *AB* ≡ *EF* então *CD* ≡ *EF*. Todo segmento é congruente a si mesmo;\\n#+BEGIN_QUOTE\\nTeorema 2.1. A relação de congruência entre segmentos satisfaz as seguintes condições:\\n**a) Reflexividade**. *AB* ≡ *AB*, para todo segmento *AB*.\\n**b) Simetria**. Se *AB* ≡ *CD* então *CD* ≡ *AB*;\\n**c) Transitividade**. Se *AB* ≡ *CD* e *CD* ≡ *EF*, então *AB* ≡ *EF*.  \\n#+END_QUOTE\\n**Axioma C.3.** *Adição*. Dados três pontos colineares *A*, *B*, *C* tais que A ✼ B ✼ C e três outros pontos colineares *D*, *E*, *F* tais que D ✼ E ✼ F, se *AB* ≡ *DE* e *BC* ≡ *EF*, então *AC* ≡ *DF*.\\n#+BEGIN_QUOTE\\nTeorema 2.2. Sejam os segmentos *AB*, *Alogseq____&apos;Blogseq____&apos;*, *CD* e *Clogseq____&apos;Dlogseq____&apos;* tais que  *AB* ≡ *Alogseq____&apos;Blogseq____&apos;* e *CD* ≡ *Clogseq____&apos;Dlogseq____&apos;*. Então *AB* + *CD* ≡ *Alogseq____&apos;Blogseq____&apos;* ≡ *Clogseq____&apos;Dlogseq____&apos;*.  \\n#+END_QUOTE\\n\\n+ **Incomensuráveis**: existem segmentos, para a Matemática, que não são comensuráveis, ou seja, que não pode ser medido.\\n\\n*Axiomas de congruência entre ângulos*\\n**Axioma CA.1.** Dado um ângulo *BAC* e uma semirreta *Alogseq____&apos;Blogseq____&apos;* existe uma **única** semirreta *Alogseq____&apos;Clogseq____&apos;* contida em um semiplano determinado por *Alogseq____&apos;Blogseq____&apos;*, tal quelogseq____&quot;,536870951]],[logseq____&quot;^15logseq____&quot;,[263,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870951]],[logseq____&quot;^15logseq____&quot;,[263,logseq____&quot;^Flogseq____&quot;,262,536870951]],[logseq____&quot;^15logseq____&quot;,[263,logseq____&quot;^Xlogseq____&quot;,185,536870951]],[logseq____&quot;^15logseq____&quot;,[263,logseq____&quot;^Vlogseq____&quot;,185,536870 rea**, pois estão construídos em um **mesmo lado** comum $[FB]$ e o **vértice** está em uma **paralela** à base.[^1]\\n![image.png](../assets/image_1778893265548_0.png)\\nOs triângulos $ABD$ e $PBD$ possuem **mesma área**, pois estão construídos em um **mesmo lado** comum $[BD]$ e o **vértice** está em uma **paralela** à base.[^2]\\n![image.png](../assets/image_1778894844751_0.png)\\nDe acordo com as afirmações acima $ABFG$ tem a mesma área de $BPLD$, pois o triângulo $FBA$ é metade do quadrado $AGFB$, o triângulo $PDL$ é metade do retângulo $BDLP$, mas temos que o triângulo $FBA$ têm a mesma área que $FBC$ e o triângulo $BDP$ tem a mesma área que $ABD$ o que significa que, como $FBC$ e $ABD$ têm a mesma área por serem triângulos congruentes, $$FBA$$ e $BDP$ tem a mesma área pois têm áreas de triângulos congruentes. logo a área do quadrado $ABFG$ tem a mesma área de $BPLD$.\\n\\nPodendo repetir o mesmo raciocínio para o outro lado, o Teorema de Pitágoras é provado:\\n![image.png](../assets/image_1778895516666_0.png)logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Flogseq____&quot;,326,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Xlogseq____&quot;,321,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Vlogseq____&quot;,326,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^Ulogseq____&quot;,321,536870961]],[logseq____&quot;^15logseq____&quot;,[327,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a0873d3-a715-45b8-bc98-c06c77ebb92flogseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[328,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;## Referências\\n[^1]: Os triângulos que estão sobre a *mesma base* e nas *mesmas paralelas* são iguais entre si (**Proposição 37**).\\n[^2]: Os triângulos que estão sobre a *mesma base* e n       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
